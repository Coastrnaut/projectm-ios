# iOS CI (research R-12; tasks T011, T015). No signing secrets: builds and tests only.
# The repository is public (2026-11-09), so standard runners are free; still keep the macOS jobs
# lean, time-limited, and cancel superseded runs.
name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-compliance:
    # Pure Python checks; run on any OS.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Script tests
        run: python scripts/test_scripts.py
      - name: Autonomous orchestrator tests
        run: python scripts/autonomous/tests/test_autonomous.py
      - name: Validate docs
        run: python scripts/validate_docs.py
      - name: Constitution compliance (required on every merge)
        run: python scripts/check_compliance.py
      - name: Licenses screen manifest (FR-067)
        run: python scripts/collect_licenses.py --check

  host-tests-linux:
    # Platform-independent package logic. Apple-only code (ScreenCaptureKit, AVFAudio, UIKit,
    # SwiftUI, os) is compiled out here, so this job never substitutes for the iOS build or for
    # device evidence.
    needs: docs-and-compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Package tests (Linux host)
        run: |
          for pkg in AudioCore CaptureKit Diagnostics CaptureUI PresetLibrary PresentationLifecycle; do
            echo "::group::swift test $pkg"
            swift test --package-path "Packages/$pkg"
            echo "::endgroup::"
          done

  build-and-test-apple:
    needs: [docs-and-compliance, angle-xcframeworks]
    # ADR-0002 pins Xcode 27.2 / iOS SDK 27.2 (T010). This job covers the iOS 26 path: it runs on
    # the macos-26 label (image macos-26-arm64: Xcode up to 26.6, iOS 26.5 SDK), pinned by the owner
    # review 2026-11-08 (ADR-0002 ruling 2) so it keeps the iOS 26 SDK when GitHub moves
    # macos-latest to Xcode 27, and it selects an Xcode 26. The iOS 27 path is compiled and
    # simulator-tested by the build-ios27 job below; System/App Capture is tested only on devices.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        # The ProjectM submodule is not needed until Plan Phase C (engine build); skip it to
        # save macOS minutes.
      - name: Preset pack submodules (feature 002 T243; projectM-iOS's build phase indexes them)
        run: |
          git submodule update --init --depth 1 Vendor/presets/cream-of-the-crop Vendor/presets/projectm-classic \
            Vendor/presets/milkdrop-original Vendor/presets/en-d Vendor/presets/milkdrop-texture-pack
      - name: Preset index builds from the pinned packs (feature 002, R-30)
        run: |
          python3 scripts/build_preset_index.py --out "$RUNNER_TEMP/preset-index" --force
          python3 - "$RUNNER_TEMP/preset-index" <<'PY'
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          presets = json.loads((out / "PresetIndex.json").read_text())["presets"]
          included = sum(p["source"] == "included" for p in presets)
          print(f"{len(presets)} presets, {included} Included, archive {(out / 'PresetArchive.bin').stat().st_size} bytes")
          assert included == 28 and len(presets) > 12_000, "unexpected index contents"
          PY
      - name: Select newest Xcode 26 (iOS 26 SDK path)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
      - name: Install XcodeGen (pinned in ADR-0002)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Toolchain pins (warning, because this job uses Xcode 26)
        run: |
          python3 scripts/verify_environment.py || \
            echo "::warning::Runner toolchain differs from the ADR-0002 pin (Xcode 27.2 / iOS SDK 27.2); expected on macos-26, where this job uses Xcode 26 for the iOS 26 path (ADR-0002)."
      - name: Probe the iOS SDK for ScreenCaptureKit (input to T035; not a substitute for it)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version) at $SDK"
          FW="$SDK/System/Library/Frameworks/ScreenCaptureKit.framework"
          if [ -d "$FW" ]; then
            echo "ScreenCaptureKit.framework: PRESENT in the iOS SDK — SCKStreamDriver.swift is compiled for iOS"
            for sym in SCContentSharingPicker SCStreamConfiguration SCStreamOutputTypeAudio capturesAudio captureMicrophone excludesCurrentProcessAudio; do
              echo "--- $sym"
              grep -rhn "$sym" "$FW/Headers" 2>/dev/null | head -4 || true
            done
          else
            echo "::warning::ScreenCaptureKit.framework is ABSENT from iOS SDK $(xcrun --sdk iphoneos --show-sdk-version); SCKStreamDriver.swift is compiled out. The capture path needs the iOS 27 SDK (Xcode 27); it is compiled on the build Mac (ADR-0002)."
          fi
      - name: Package tests (macOS host)
        run: |
          for pkg in AudioCore CaptureKit Diagnostics CaptureUI PresetLibrary PresentationLifecycle; do
            echo "::group::swift test $pkg"
            swift test --package-path "Packages/$pkg"
            echo "::endgroup::"
          done
      - name: Compile packages for iOS (device SDK, includes Apple-only code)
        run: |
          for pkg in AudioCore CaptureKit Diagnostics CaptureUI PresetLibrary PresentationLifecycle; do
            echo "::group::xcodebuild $pkg (generic iOS)"
            (cd "Packages/$pkg" && xcodebuild -quiet -scheme "$pkg" -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/dd-$pkg" -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO build)
            echo "::endgroup::"
          done
      - name: Download the engine and ANGLE xcframeworks (projectM-iOS needs them)
        uses: actions/download-artifact@v4
        with:
          name: ProjectM.xcframework
          path: Build
      - uses: actions/download-artifact@v4
        with:
          name: ANGLEFrameworks
          path: Build/ANGLEFrameworks
      - name: Generate project
        run: xcodegen generate
      - name: Build CaptureLab (generic iOS, unsigned)
        run: |
          xcodebuild -quiet -project ProjectM-iOS.xcodeproj -scheme CaptureLab \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-app" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build projectM-iOS (generic iOS, unsigned; T080)
        run: |
          xcodebuild -quiet -project ProjectM-iOS.xcodeproj -scheme projectM-iOS \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd-app" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Find an iOS simulator
        id: sim
        run: |
          # Newest iOS runtime the selected Xcode can run (not newer than its simulator SDK).
          SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list -j devices available | SIM_SDK="$SIM_SDK" python3 -c '
          import json, os, re, sys
          data = json.load(sys.stdin)["devices"]
          sdk = tuple(int(x) for x in os.environ["SIM_SDK"].split(".")[:2])
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))   # numeric, so 26.10 > 26.5
              if version > sdk:
                  continue
              for d in devices:
                  if "iPhone" in d["name"] and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"], runtime)
          if best:
              # Logged so the run shows which iOS version the simulator tests cover (ADR-0002).
              print(f"Selected simulator: {best[2]} on iOS {best[0][0]}.{best[0][1]} ({best[3]})", file=sys.stderr)
          print(best[1] if best else "")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          [ -n "$UDID" ] || echo "::warning::No iOS simulator runtime on this image; simulator tests skipped."
      - name: Package tests on the iOS Simulator
        if: steps.sim.outputs.udid != ''
        run: |
          set -o pipefail
          for pkg in AudioCore CaptureKit Diagnostics CaptureUI PresetLibrary PresentationLifecycle; do
            echo "::group::xcodebuild test $pkg (iOS Simulator)"
            (cd "Packages/$pkg" && xcodebuild -scheme "$pkg" -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dds-$pkg" CODE_SIGNING_ALLOWED=NO test 2>&1 \
              | grep -E "error:|warning:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|failed \(")
            echo "::endgroup::"
          done
      - name: Build leaves the tree clean (gitignore check, T002)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The build left untracked or modified files; extend .gitignore."
            exit 1
          fi

  engine-xcframework:
    # Task T066 (RI-011, ADR-0004): build the projectM engine as Build/ProjectM.xcframework with
    # scripts/build_projectm_xcframework.py from a fresh checkout. Vendor/projectM is the owner's
    # fork, branch `ios` (Constitution VIII v1.1.0); its own submodule vendor/projectm-eval is
    # needed too. The result is cached by engine commit, build-script hash and Xcode build, and
    # uploaded for later jobs (ProjectMBridge, Phase C).
    needs: docs-and-compliance
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Engine submodule (recursive; Vendor/angle is not needed here)
        run: git submodule update --init --recursive Vendor/projectM
      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          command -v cmake >/dev/null || brew install cmake
          cmake --version | head -1
      - name: Cache key
        id: key
        run: |
          ENGINE=$(git rev-parse HEAD:Vendor/projectM)
          XCODE_BUILD=$(xcodebuild -version | sed -nE 's/^Build version (.+)$/\1/p')
          SCRIPT=$(shasum -a 256 scripts/build_projectm_xcframework.py | cut -c1-16)
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "key=projectm-xcframework-$ENGINE-$SCRIPT-$XCODE_BUILD" >> "$GITHUB_OUTPUT"
          echo "Engine commit: $ENGINE (Xcode $XCODE_BUILD)"
      - name: Restore the cached xcframework
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            Build/ProjectM.xcframework
            Build/ProjectM.xcframework.json
          key: ${{ steps.key.outputs.key }}
      - name: Build the engine xcframework
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_projectm_xcframework.py
      - name: Check the xcframework
        run: |
          echo "cache hit: ${{ steps.cache.outputs.cache-hit == 'true' }}"
          cat Build/ProjectM.xcframework.json
          set -e
          DEV=Build/ProjectM.xcframework/ios-arm64/projectM-4.framework
          SIM=Build/ProjectM.xcframework/ios-arm64_x86_64-simulator/projectM-4.framework
          [ "$(lipo -archs $DEV/projectM-4)" = "arm64" ]
          lipo -archs $SIM/projectM-4 | tr ' ' '\n' | sort | tr '\n' ' ' | grep -q "arm64 x86_64"
          otool -D $DEV/projectM-4 | grep -q "@rpath/projectM-4.framework/projectM-4"
          test -f $DEV/Headers/projectM.h
          grep -q "${{ steps.key.outputs.engine }}" Build/ProjectM.xcframework.json
      - name: OpenGL ES load-proc table matches the SDK
        run: python3 scripts/generate_gles_loader.py --check
      - name: ProjectMBridge and Rendering tests on an iOS Simulator (T068, T071)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devs.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if "iPhone" in d["name"] and (best is None or runtime > best[0]):
                      best = (runtime, d["udid"], d["name"])
          print(best[1] if best else "")
          print(f"Selected simulator: {best[2]} ({best[0]})" if best else "no iPhone simulator", file=sys.stderr)
          ')
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator available"; exit 1; }
          # Rendering has two products (Rendering, CFlashLimiter; T119), so its test scheme is
          # SwiftPM's Rendering-Package.
          for entry in ProjectMBridge:ProjectMBridge Rendering:Rendering-Package; do
            pkg=${entry%%:*}; scheme=${entry#*:}
            echo "::group::xcodebuild test $pkg (iOS Simulator)"
            (cd "Packages/$pkg" && xcodebuild -scheme "$scheme" -destination "id=$UDID" \
              -derivedDataPath "$RUNNER_TEMP/dd-$pkg" CODE_SIGNING_ALLOWED=NO test 2>&1 \
              | grep -E "error:|warning:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|failed \(")
            echo "::endgroup::"
          done
      - name: Upload the xcframework
        uses: actions/upload-artifact@v4
        with:
          name: ProjectM.xcframework
          path: |
            Build/ProjectM.xcframework
            Build/ProjectM.xcframework.json
          retention-days: 14

  angle-xcframeworks:
    # Task T076 (ADR-0003 Option B, ADR-0004): build ANGLE's Metal backend as
    # Build/ANGLEFrameworks/libEGL.xcframework and libGLESv2.xcframework with
    # scripts/build_angle_xcframework.py from the Vendor/angle submodule (the owner's fork, branch
    # `ios`, pinned) and its gclient dependencies (about 12 GB on a cache miss). Cached by ANGLE
    # commit, build-script hash and Xcode build. Then runs the ANGLERendering tests (T077) with the
    # engine xcframework from engine-xcframework.
    needs: engine-xcframework
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Cache key
        id: key
        run: |
          ANGLE=$(git rev-parse HEAD:Vendor/angle)
          XCODE_BUILD=$(xcodebuild -version | sed -nE 's/^Build version (.+)$/\1/p')
          SCRIPT=$(shasum -a 256 scripts/build_angle_xcframework.py | cut -c1-16)
          echo "angle=$ANGLE" >> "$GITHUB_OUTPUT"
          echo "key=angle-xcframeworks-$ANGLE-$SCRIPT-$XCODE_BUILD" >> "$GITHUB_OUTPUT"
          echo "ANGLE commit: $ANGLE (Xcode $XCODE_BUILD)"
      - name: Restore the cached xcframeworks
        id: cache
        uses: actions/cache@v4
        with:
          path: Build/ANGLEFrameworks
          key: ${{ steps.key.outputs.key }}
      - name: Build ANGLE
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 Vendor/angle
          df -h . | tail -1
          python3 scripts/build_angle_xcframework.py
      - name: Check the xcframeworks
        run: |
          set -e
          echo "cache hit: ${{ steps.cache.outputs.cache-hit == 'true' }}"
          cat Build/ANGLEFrameworks/ANGLE.json
          grep -q "${{ steps.key.outputs.angle }}" Build/ANGLEFrameworks/ANGLE.json
          for lib in libEGL libGLESv2; do
            DEV=Build/ANGLEFrameworks/$lib.xcframework/ios-arm64/$lib.framework/$lib
            SIM=Build/ANGLEFrameworks/$lib.xcframework/ios-arm64_x86_64-simulator/$lib.framework/$lib
            [ "$(lipo -archs $DEV)" = "arm64" ]
            lipo -archs $SIM | tr ' ' '\n' | sort | tr '\n' ' ' | grep -q "arm64 x86_64"
            otool -D $DEV | grep -q "@rpath/$lib.framework/$lib"
          done
          ls Build/ANGLEFrameworks/licenses
      - name: Upload the ANGLE xcframeworks
        uses: actions/upload-artifact@v4
        with:
          name: ANGLEFrameworks
          path: Build/ANGLEFrameworks
          retention-days: 14
      - name: Download the engine xcframework
        uses: actions/download-artifact@v4
        with:
          name: ProjectM.xcframework
          path: Build
      - name: ANGLERendering tests on an iOS Simulator (T077)
        run: |
          set -o pipefail
          git submodule update --init Vendor/projectM   # the tests load the engine's test presets
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devs.items():
              if "iOS" not in runtime:
                  continue
              for d in items:
                  if "iPhone" in d["name"] and (best is None or runtime > best[0]):
                      best = (runtime, d["udid"], d["name"])
          print(best[1] if best else "")
          ')
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator available"; exit 1; }
          (cd Packages/ANGLERendering && xcodebuild -scheme ANGLERendering -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd-angle" CODE_SIGNING_ALLOWED=NO test 2>&1 \
            | grep -E "error:|warning:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|failed \(")

  build-ios27:
    # Owner ruling 2026-11-08 (ADR-0002): compile the System/App Capture driver against the iOS 27
    # SDK on every run, because the main job (macos-26, iOS 26.5 SDK) compiles it out. GitHub's
    # `xcode-27` image is a public preview; which Xcode 27 builds it carries changes between image
    # versions (20261026.0314.1: 27.2 RC 27B48 and 27.1 default), so the job picks the newest
    # Xcode 27 that can build for iOS devices, logs it, and warns (without failing) when its build
    # is not the one pinned in ADR-0002 (owner review ruling 3). Owner review ruling 4: it also
    # runs the package tests on an iOS 27 simulator. No signing; System/App Capture itself cannot
    # run on any simulator and is tested only on devices.
    needs: [docs-and-compliance, angle-xcframeworks]
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode 27 that can build for iOS devices
        run: |
          SELECTED=""
          for X in /Applications/Xcode_27.2.app /Applications/Xcode_27.1.app /Applications/Xcode_27.app; do
            [ -d "$X" ] || continue
            sudo xcode-select -s "$X/Contents/Developer"
            # A usable generic iOS destination is listed without an "error:" (platform installed).
            if (cd Packages/CaptureKit && xcodebuild -scheme CaptureKit -showdestinations 2>/dev/null) \
                | grep 'name:Any iOS Device' | grep -vq 'error:'; then
              SELECTED="$X"; break
            fi
            echo "::warning::$X cannot build for iOS devices on this image; trying the next Xcode 27"
          done
          [ -n "$SELECTED" ] || { echo "::error::No Xcode 27 on this image can build for iOS devices"; exit 1; }
          echo "Selected $SELECTED"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Compare the selected Xcode with the ADR-0002 pin (warning only)
        run: |
          # The pin is read from ADR-0002's Toolchain pin paragraph, e.g. Xcode `27.2` (build 27B52).
          ADR=docs/adr/0002-minimum-ios-version.md
          PIN=$(sed -nE 's/.*Toolchain pin.*Xcode `([0-9][0-9.]*)` \(build ([0-9A-Za-z]+)\).*/\1 \2/p' "$ADR" | head -1)
          PIN_VERSION=${PIN% *}
          PIN_BUILD=${PIN#* }
          if [ -z "$PIN" ] || [ -z "$PIN_VERSION" ] || [ -z "$PIN_BUILD" ] || [ "$PIN_VERSION" = "$PIN_BUILD" ]; then
            echo "::error file=$ADR::Cannot read the pinned Xcode build from the Toolchain pin paragraph of $ADR (expected: Xcode \`<version>\` (build <build>))"
            exit 1
          fi
          BUILD=$(xcodebuild -version | sed -nE 's/^Build version ([0-9A-Za-z]+).*/\1/p')
          VERSION=$(xcodebuild -version | sed -nE 's/^Xcode ([0-9][0-9.]*).*/\1/p')
          echo "ADR-0002 pin: Xcode $PIN_VERSION (build $PIN_BUILD); selected: Xcode ${VERSION:-unknown} (build ${BUILD:-unknown})"
          if [ "$BUILD" != "$PIN_BUILD" ]; then
            echo "::warning::Selected Xcode ${VERSION:-unknown} (build ${BUILD:-unknown}) is not the build pinned in ADR-0002, Xcode $PIN_VERSION (build $PIN_BUILD); results may differ from the build Mac."
          fi
      - name: Require ScreenCaptureKit in the iOS SDK
        run: |
          FW="$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/ScreenCaptureKit.framework"
          [ -d "$FW" ] || { echo "::error::ScreenCaptureKit.framework is missing from the iOS SDK"; exit 1; }
      - name: Install XcodeGen (pinned in ADR-0002)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build CaptureKit for iOS devices (compiles SCKStreamDriver)
        run: |
          cd Packages/CaptureKit
          xcodebuild -quiet -scheme CaptureKit -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd27" CODE_SIGNING_ALLOWED=NO build
      - name: Confirm the capture driver was compiled
        run: |
          # The object file exists even when `#if ... canImport(ScreenCaptureKit)` compiles the whole
          # file out, so check its symbols: the driver class and a ScreenCaptureKit reference.
          OBJ=$(find "$RUNNER_TEMP/dd27" -path '*Debug-iphoneos*' -name 'SCKStreamDriver.o' | head -1)
          [ -n "$OBJ" ] && nm -U "$OBJ" | grep -q SCKStreamDriver && nm -u "$OBJ" | grep -q SCContentSharingPicker \
            || { echo "::error::SCKStreamDriver.swift was compiled out or not built"; exit 1; }
          echo "SCKStreamDriver.swift compiled against iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Download the engine and ANGLE xcframeworks (projectM-iOS needs them)
        uses: actions/download-artifact@v4
        with:
          name: ProjectM.xcframework
          path: Build
      - uses: actions/download-artifact@v4
        with:
          name: ANGLEFrameworks
          path: Build/ANGLEFrameworks
      - name: Build CaptureLab for iOS devices
        run: |
          xcodegen generate
          xcodebuild -quiet -project ProjectM-iOS.xcodeproj -scheme CaptureLab \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd27-app" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Find an iOS 27 simulator
        id: sim27
        run: |
          # Same approach as the main job, restricted to iOS 27.x: the newest iOS 27 runtime the
          # selected Xcode can run (not newer than its simulator SDK) and an iPhone for it.
          SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list -j devices available | SIM_SDK="$SIM_SDK" python3 -c '
          import json, os, re, sys
          data = json.load(sys.stdin)["devices"]
          sdk = tuple(int(x) for x in os.environ["SIM_SDK"].split(".")[:2])
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))   # numeric, so 27.10 > 27.5
              if version[0] != 27 or version > sdk:
                  continue
              for d in devices:
                  if "iPhone" in d["name"] and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"], runtime)
          if best:
              # Logged so the run shows which iOS version the simulator tests cover (ADR-0002).
              print(f"Selected simulator: {best[2]} on iOS {best[0][0]}.{best[0][1]} ({best[3]})", file=sys.stderr)
          print(best[1] if best else "")
          ')
          if [ -z "$UDID" ]; then
            xcrun simctl list runtimes || true
            echo "::error::No available iPhone simulator on an iOS 27.x runtime (simulator SDK $SIM_SDK) on this image; the iOS 27 simulator tests (ADR-0002 owner review ruling 4) cannot run."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Package tests on the iOS 27 Simulator
        run: |
          set -o pipefail
          for pkg in AudioCore CaptureKit Diagnostics CaptureUI PresetLibrary PresentationLifecycle; do
            echo "::group::xcodebuild test $pkg (iOS 27 Simulator)"
            (cd "Packages/$pkg" && xcodebuild -scheme "$pkg" -destination "id=${{ steps.sim27.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dds27-$pkg" CODE_SIGNING_ALLOWED=NO test 2>&1 \
              | grep -E "error:|warning:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|failed \(")
            echo "::endgroup::"
          done
