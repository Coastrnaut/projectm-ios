# XcodeGen project definition (research R-12). Generate on macOS with:  xcodegen generate
# The generated ProjectM-iOS.xcodeproj is gitignored. Edit this file, not the project.
#
# Signing: DEVELOPMENT_TEAM and provisioning are set by a human in Xcode or via a local,
# uncommitted xcconfig. Never by automation (Constitution: Security).
# Entitlements: only the Screen Recording entitlement, from Apps/CaptureLab/CaptureLab.entitlements
# through CODE_SIGN_ENTITLEMENTS (ADR-0001 Decision 6). Background modes: none (research R-03,
# R-16). scripts/check_compliance.py fails the build on any other entitlement or background mode.
name: ProjectM-iOS
options:
  bundleIdPrefix: org.projectmios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad device family (FR-041)
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AudioCore:
    path: Packages/AudioCore
  CaptureKit:
    path: Packages/CaptureKit
  CaptureUI:
    path: Packages/CaptureUI
  Diagnostics:
    path: Packages/Diagnostics
targets:
  CaptureLab:
    type: application
    platform: iOS
    sources:
      - path: Apps/CaptureLab
        excludes:
          - "**/.gitkeep"
          - "UITests/**"
    dependencies:
      - package: AudioCore
      - package: CaptureKit
      - package: CaptureUI
      - package: Diagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.projectmios.CaptureLab   # separate app; tester-only (FR-090)
        PRODUCT_NAME: CaptureLab
        INFOPLIST_KEY_CFBundleDisplayName: CaptureLab
        GENERATE_INFOPLIST_FILE: NO
        # ADR-0001 Decision 6 (owner review 2026-11-08): the Screen Recording entitlement, as in
        # Apple's iOS ScreenCaptureKit sample. The owner confirms provisioning in Xcode.
        CODE_SIGN_ENTITLEMENTS: Apps/CaptureLab/CaptureLab.entitlements
        # ADR-0002 owner review: weak-link ScreenCaptureKit explicitly, so CaptureLab launches on
        # iOS 26, which has no such framework. Only an SDK that ships the framework accepts the
        # flag (the iOS 26.5 SDK in CI has none), hence the iOS 27 SDK condition; extend it when
        # the toolchain pin moves to a newer SDK.
        "OTHER_LDFLAGS[sdk=iphoneos27*]": "$(inherited) -weak_framework ScreenCaptureKit"
    info:
      path: Apps/CaptureLab/Info.plist
      properties:
        CFBundleDisplayName: CaptureLab
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # FR-019: identical to the Microphone explainer in contracts/ui-states.md
        NSMicrophoneUsageDescription: "Microphone mode listens to sound in the room through your device's microphone. It does not capture audio directly from other apps."
        # FR-019: the capture key named by Apple's ScreenCaptureKit overview (RI-001, T035). It is
        # absent from Xcode 27.2's Info.plist definitions; whether iOS 27 shows it is recorded in T040.
        NSScreenCaptureUsageDescription: "Only the audio of the content you choose to share is used, and only on this device. It is not recorded or sent anywhere."
  CaptureLabUITests:
    # Simulator UI-flow tests (T034, T039, T048). Never capture evidence (Constitution X).
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/CaptureLab/UITests
    dependencies:
      - target: CaptureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.projectmios.CaptureLabUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CaptureLab:
    build:
      targets:
        CaptureLab: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CaptureLabUITests
    # Archive is used for TestFlight internal/external testing only. CaptureLab is never
    # submitted for App Store review (FR-090; docs/release/capturelab-distribution.md).
    archive:
      config: Release
