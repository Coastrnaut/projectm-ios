# XcodeGen project definition (research R-12). Generate on macOS with:  xcodegen generate
# The generated ProjectM-iOS.xcodeproj is gitignored. Edit this file, not the project.
#
# Signing: DEVELOPMENT_TEAM and provisioning are set by a human in Xcode or via a local,
# uncommitted xcconfig. Never by automation (Constitution: Security).
# Entitlements: none. The Screen Recording entitlement (ADR-0001 Decision 6) was removed on
# 2026-11-09 because it is offered only to organization accounts (ruling 16); if it returns, it
# goes in through CODE_SIGN_ENTITLEMENTS, the only form scripts/check_compliance.py allows.
# Background modes: only screen-capture (ADR-0001 ruling 17, 2026-11-09: without it, leaving
# CaptureLab ends capture with SCStreamError -3824). check_compliance.py allows exactly this value.
name: ProjectM-iOS
options:
  bundleIdPrefix: org.projectmios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  # Optional local signing (gitignored Configs/Signing.local.xcconfig); see Configs/Signing.xcconfig.
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad device family (FR-041)
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AudioCore:
    path: Packages/AudioCore
  CaptureKit:
    path: Packages/CaptureKit
  CaptureUI:
    path: Packages/CaptureUI
  Diagnostics:
    path: Packages/Diagnostics
  # projectM-iOS only (Stage 2). These need Build/ProjectM.xcframework and Build/ANGLEFrameworks
  # (scripts/build_projectm_xcframework.py, scripts/build_angle_xcframework.py); CI downloads them
  # from its engine-xcframework and angle-xcframeworks jobs before generating the project.
  ProjectMBridge:
    path: Packages/ProjectMBridge
  Rendering:
    path: Packages/Rendering
  ANGLERendering:
    path: Packages/ANGLERendering
  # Feature 002: the preset library index, tree, scopes and search (Foundation only).
  PresetLibrary:
    path: Packages/PresetLibrary
  # PRE-014: archive container, CRC-32 and SHA-256 (Foundation only; PresetLibrary depends on it).
  LocalPortability:
    path: Packages/LocalPortability
  # PERF-011: presentation availability and the registry of presentation-bound resources
  # (pure Swift; the renderer packages depend on it too).
  PresentationLifecycle:
    path: Packages/PresentationLifecycle
  # VIS-001 (ADR-0009): native visuals beside projectM, fed by the ANL-001/002 analysis.
  AnalysisFeatures:
    path: Packages/AnalysisFeatures
  VisualGenerators:
    path: Packages/VisualGenerators
  # SHOW-011: tap tempo and the tempo source for live-performance rows (pure Swift + bus adapter).
  PerformanceControl:
    path: Packages/PerformanceControl
  # MOD-001: the typed parameter registry (PerformanceControl's OSC receiver writes its store, OSC-001).
  ParameterGraph:
    path: Packages/ParameterGraph
  # CMP-001 layer contract and compositor; CAM-001: the camera layer (target CameraLayer).
  Compositor:
    path: Packages/Compositor
  # SCN-001 scene document; FILE-001 portable scene archive (pure Swift; SceneArchiveService).
  SceneFormat:
    path: Packages/SceneFormat
  SceneArchive:
    path: Packages/SceneArchive
  # SHOW-001: the manual cue list (pure model) and its folder store (ShowStorage, on SceneFormat).
  ShowControl:
    path: Packages/ShowControl
  # FILE-005: the local library backup (archive, logical records, restore planner and installer).
  LibraryBackup:
    path: Packages/LibraryBackup
targets:
  CaptureLab:
    type: application
    platform: iOS
    sources:
      - path: Apps/CaptureLab
        excludes:
          - "**/.gitkeep"
          - "UITests/**"
    dependencies:
      - package: AudioCore
      - package: CaptureKit
      - package: CaptureUI
      - package: Diagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.projectmios.CaptureLab   # separate app; tester-only (FR-090)
        PRODUCT_NAME: CaptureLab
        INFOPLIST_KEY_CFBundleDisplayName: CaptureLab
        GENERATE_INFOPLIST_FILE: NO
        # ADR-0002 owner review: weak-link ScreenCaptureKit explicitly, so CaptureLab launches on
        # iOS 26, which has no such framework. Only an SDK that ships the framework accepts the
        # flag (the iOS 26.5 SDK in CI has none), hence the iOS 27 SDK condition; extend it when
        # the toolchain pin moves to a newer SDK.
        "OTHER_LDFLAGS[sdk=iphoneos27*]": "$(inherited) -weak_framework ScreenCaptureKit"
    info:
      path: Apps/CaptureLab/Info.plist
      properties:
        CFBundleDisplayName: CaptureLab
        # Shown as "app build" in every export. Raise it whenever Info.plist or capture behavior
        # changes: 1 = before ruling 17, 2 = screen-capture background mode (2026-11-09).
        CFBundleVersion: "2"
        UILaunchScreen: {}
        # ADR-0001 ruling 17 (T041 on D1): keeps System/App Capture running while CaptureLab is in
        # the background. Visualization stays foreground-only. The only background mode allowed.
        UIBackgroundModes: [screen-capture]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # FR-019: identical to the Microphone explainer in contracts/ui-states.md
        NSMicrophoneUsageDescription: "Microphone mode listens to sound in the room through your device's microphone. It does not capture audio directly from other apps."
        # FR-019: the capture key named by Apple's ScreenCaptureKit overview (RI-001, T035). It is
        # absent from Xcode 27.2's Info.plist definitions; whether iOS 27 shows it is recorded in T040.
        NSScreenCaptureUsageDescription: "Only the audio of the content you choose to share is used, and only on this device. It is not recorded or sent anywhere."
  CaptureLabUITests:
    # Simulator UI-flow tests (T034, T039, T048). Never capture evidence (Constitution X).
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/CaptureLab/UITests
    dependencies:
      - target: CaptureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.projectmios.CaptureLabUITests
        GENERATE_INFOPLIST_FILE: YES
  projectM-iOS:
    # The visualizer app (Stage 2, Plan Phase D; task T080). Renderer: ANGLE on Metal (ADR-0003).
    type: application
    platform: iOS
    sources:
      - path: Apps/projectM-iOS
        excludes:
          - "**/.gitkeep"
          - "UITests/**"
          - "Tests/**"
          - "Resources/Presets"
          - "Resources/Licenses"
          - "Resources/SceneTemplates"   # SCN-011: bundled as a folder below
          - "Resources/PresetExclusions.txt"   # build input only (research R-30); PresetBlocklist.json is also bundled, for imports (PRE-012-R6)
          - "Store/*.storekit"   # StoreKit test configuration: scheme and tests only
      - path: Apps/projectM-iOS/Resources/Presets
        type: folder
        buildPhase: resources
      # Licenses screen texts (T103, scripts/collect_licenses.py).
      - path: Apps/projectM-iOS/Resources/Licenses
        type: folder
        buildPhase: resources
      # SCN-011: read-only starter scenes and their licence manifest (the app's own MIT content).
      - path: Apps/projectM-iOS/Resources/SceneTemplates
        type: folder
        buildPhase: resources
      # In-App Playback track and the SC-006 click timings (T044).
      - path: Apps/CaptureLab/Resources/reference.wav
        buildPhase: resources
      - path: Apps/CaptureLab/Resources/reference-clicks.json
        buildPhase: resources
    # Feature 002 (research R-30): build the preset index, pack list, compressed archive and
    # textures from the Vendor/presets submodules straight into the app's resources; nothing
    # generated is committed. The stamp keeps unchanged builds fast.
    preBuildScripts:
      - name: Preset library (feature 002)
        script: |
          python3 "$SRCROOT/scripts/build_preset_index.py" --out "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" --stamp "$DERIVED_FILE_DIR/preset-index-stamp"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PresetIndex.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PresetPacks.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PresetArchive.bin
    dependencies:
      - package: AudioCore
      - package: CaptureKit
      - package: CaptureUI
      - package: Diagnostics
      - package: ProjectMBridge
      - package: Rendering
      - package: ANGLERendering
      - package: PresetLibrary
      - package: PresentationLifecycle
      - package: VisualGenerators   # VIS-001: the circular spectrum
      - package: PerformanceControl   # SHOW-011: tap tempo; OSC-001: the OSC receiver
      - package: Compositor           # CAM-001: the Camera visual (camera and spectrum layers)
      - package: SceneFormat          # FILE-001: scene documents in scene archives
      - package: SceneArchive         # FILE-001: SceneArchiveService
      - package: LocalPortability     # FILE-009: StorageUsageCalculator
      - package: ShowControl          # SHOW-001: the cue list and its folder store
      - package: LibraryBackup        # FILE-005: back up and restore the library
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.projectmios.ProjectMiOS
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # the preset library build phase reads Vendor/presets (research R-30)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # the UWP frontend's projectM logo (scripts/make_app_icon.swift)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # ACC-003-R6, R7: contrast-checked accent
        PRODUCT_NAME: projectM-iOS
        PRODUCT_MODULE_NAME: projectM_iOS   # Swift module (the hyphen is not allowed)
        GENERATE_INFOPLIST_FILE: NO
        "OTHER_LDFLAGS[sdk=iphoneos27*]": "$(inherited) -weak_framework ScreenCaptureKit"
    info:
      path: Apps/projectM-iOS/Info.plist
      properties:
        CFBundleDisplayName: projectM
        CFBundleShortVersionString: "1.1"   # feature 002 (full preset library)
        CFBundleVersion: "2"
        UILaunchScreen: {}
        # R-16 / ADR-0001 ruling 17: the only background mode allowed (capture keeps running while
        # the visualization is paused in the background, FR-050).
        UIBackgroundModes: [screen-capture]
        # Export compliance (owner 2026-11-10): no encryption beyond what iOS provides. The only
        # networking is OSC-001's local UDP listener (unencrypted, no internet), so this stays false.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        # SCN-014 (research SCN-014-D7): the scene pack type (FILE-001's `.pmscene`), so the file picker can
        # offer packs. Exported only: no document types, the app is never opened with a file.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.projectmios.scene-archive
            UTTypeDescription: projectM-iOS Scene Pack
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pmscene]
        # OUT-001 (research OUT-001-D1, ADR-0023): a connected display gets a visualization-only window
        # instead of the system's mirror. Only the external display role is configured; the application
        # role stays with SwiftUI's window group, and multiple windows stay off.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # FR-019: identical to the Microphone explainer in contracts/ui-states.md
        NSMicrophoneUsageDescription: "Microphone mode listens to sound in the room through your device's microphone. It does not capture audio directly from other apps."
        NSScreenCaptureUsageDescription: "Only the audio of the content you choose to share is used, and only on this device. It is not recorded or sent anywhere."
        # CAM-001-R4 (spec 033, ADR-0017): asked only when the user chooses the Camera visual. FILE-013
        # moved it here from the CaptureLab target, where CAM-001 had put it (the app lacked it).
        # CAM-002-R9: reworded for the front camera and the user's own saves (spec 096, Clarifications).
        NSCameraUsageDescription: "The Camera visual shows the live view from the front or rear camera you choose, behind the visualization. The picture stays on your device: it is never sent, and it is saved only when you save a frame or record the visualization yourself."
        # OSC-001-R17 (FR-068 amendment, ADR-0008): shown when the user turns on OSC receiver. No
        # NSBonjourServices: OSC-001 advertises and browses nothing (OSC-011 adds discovery).
        NSLocalNetworkUsageDescription: "When you turn on OSC receiver in Settings, projectM listens on your local network for OSC control messages. It never connects to the internet."
  projectM-iOSTests:
    # Unit tests hosted in the app (T086 idle-timer policy; later T088 presets).
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/projectM-iOS/Tests
      - path: Apps/projectM-iOS/Store/projectM-iOS.storekit   # SKTestSession (feature 002 T225)
        buildPhase: resources
      - path: specs/209-perf-012-performance-report/contracts/performance-report.schema.json   # PERF-012-T13
        buildPhase: resources
    dependencies:
      - target: projectM-iOS
      - package: PresetLibrary
      - package: PerformanceControl   # SHOW-011 TempoCoordinatorTests
      - package: AudioCore            # SHOW-011 TempoCoordinatorTests (an analysis tap)
      - package: ParameterGraph       # MOD-001 ParameterCatalogAppTests; OSC-001 coordinator tests
      - package: LocalPortability     # FILE-001 SceneArchiveServiceTests (a hand-built hostile archive)
      - package: AnalysisFeatures     # ANL-003 SpectralSmoothingAppTests (SmoothingTimes)
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.projectmios.ProjectMiOSTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/projectM-iOS.app/projectM-iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  projectM-iOSUITests:
    # Simulator UI tests (T081): controls, auto-hide, rotation, compact layout. Never device evidence.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/projectM-iOS/UITests
      - path: Apps/projectM-iOS/Store/projectM-iOS.storekit   # SKTestSession in PurchaseUITests (T229)
        buildPhase: resources
    dependencies:
      - target: projectM-iOS
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.projectmios.ProjectMiOSUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  projectM-iOS:
    build:
      targets:
        projectM-iOS: all
    run:
      storeKitConfiguration: Apps/projectM-iOS/Store/projectM-iOS.storekit   # feature 002 T224
      config: Debug
    test:
      config: Debug
      targets:
        - projectM-iOSTests
        - projectM-iOSUITests
    archive:
      config: Release
  CaptureLab:
    build:
      targets:
        CaptureLab: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CaptureLabUITests
    # Archive is used for TestFlight internal/external testing only. CaptureLab is never
    # submitted for App Store review (FR-090; docs/release/capturelab-distribution.md).
    archive:
      config: Release
